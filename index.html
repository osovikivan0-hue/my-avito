<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Барахолка класса</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f2f4f7; color: #1a1a1a; }
  header { background: #fff; padding: 12px 16px; display: flex; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 10; box-shadow: 0 1px 4px rgba(0,0,0,.08); flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; flex: 1; min-width: 120px; }
  .who { font-size: 13px; color: #6b7280; }
  .who b { color: #111; }
  .btn { background: #2563eb; color: #fff; border: none; border-radius: 10px; padding: 9px 14px; font-size: 14px; cursor: pointer; }
  .btn:disabled { background: #9ca3af; cursor: default; }
  .btn.secondary { background: #e5e7eb; color: #111; }
  .btn.danger { background: #dc2626; }
  .btn.small { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
  .container { max-width: 960px; margin: 0 auto; padding: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s; display: flex; flex-direction: column; position: relative; }
  .card:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(0,0,0,.1); }
  .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; background: #e5e7eb; }
  .card .body { padding: 10px 12px 14px; }
  .card .price { font-weight: 700; font-size: 17px; margin-bottom: 4px; }
  .card .title { font-size: 14px; line-height: 1.3; color: #374151; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card .seller { font-size: 12px; color: #6b7280; margin-top: 6px; }
  .card .mine { position: absolute; top: 8px; left: 8px; background: #16a34a; color: #fff; font-size: 11px; padding: 3px 8px; border-radius: 20px; }
  .empty { text-align: center; color: #6b7280; padding: 40px 0; }
  .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 100; }
  .modal-bg.open { display: flex; }
  .modal { background: #fff; border-radius: 16px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; }
  .modal .top { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid #eee; position: sticky; top: 0; background: #fff; z-index: 2; }
  .modal .top h2 { font-size: 18px; margin: 0; }
  .close { background: none; border: none; font-size: 24px; cursor: pointer; color: #6b7280; line-height: 1; }
  .modal .content { padding: 16px; }
  .modal img.big { width: 100%; max-height: 360px; object-fit: contain; background: #f3f4f6; border-radius: 12px; }
  .modal .price-big { font-size: 26px; font-weight: 800; margin: 14px 0 6px; }
  .modal .desc { color: #374151; white-space: pre-wrap; margin: 10px 0; }
  .modal .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .modal .actions .btn { flex: 1; min-width: 120px; }
  /* Чат */
  .chat { margin-top: 20px; border-top: 1px solid #eee; padding-top: 14px; }
  .chat h3 { font-size: 15px; margin: 0 0 10px; }
  .chat-list { max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; }
  .msg { background: #f3f4f6; border-radius: 10px; padding: 8px 10px; font-size: 14px; max-width: 85%; }
  .msg.mine { background: #dbeafe; align-self: flex-end; }
  .msg .meta { font-size: 11px; color: #6b7280; margin-bottom: 2px; display: flex; gap: 8px; }
  .msg .meta .del { cursor: pointer; color: #dc2626; }
  .chat-form { display: flex; gap: 8px; }
  .chat-form input { flex: 1; padding: 10px; font-size: 14px; border: 1px solid #d1d5db; border-radius: 10px; font-family: inherit; }
  .chat-empty { color: #9ca3af; font-size: 13px; padding: 8px 0; }
  /* Форма */
  .form-box { background: #fff; border-radius: 14px; padding: 16px; margin-bottom: 20px; }
  .form-box h2 { font-size: 17px; margin: 0 0 12px; }
  .form-box input, .form-box textarea { width: 100%; padding: 10px; font-size: 15px; border: 1px solid #d1d5db; border-radius: 10px; margin-bottom: 10px; font-family: inherit; }
  .form-box label { font-size: 13px; color: #6b7280; display: block; margin-bottom: 4px; }
  .status { font-size: 14px; margin-bottom: 10px; }
  .status.error { color: #dc2626; }
  .status.ok { color: #16a34a; }
  /* Логин */
  .login-bg { position: fixed; inset: 0; background: #f2f4f7; display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 200; }
  .login-bg.hidden { display: none; }
  .login { background: #fff; border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 10px 30px rgba(0,0,0,.1); }
  .login h2 { margin: 0 0 8px; font-size: 20px; }
  .login p { margin: 0 0 16px; color: #6b7280; font-size: 14px; }
  .login input { width: 100%; padding: 12px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 10px; margin-bottom: 12px; }
</style>
</head>
<body>

<div class="login-bg" id="loginBg">
  <div class="login">
    <h2>Как вас зовут?</h2>
    <p>Имя нужно, чтобы вы могли удалять свои объявления и писать в чате.</p>
    <input type="text" id="loginName" placeholder="Например, Петя Иванов" maxlength="40">
    <button class="btn" id="loginBtn" style="width:100%">Войти</button>
  </div>
</div>

<header>
  <h1>🛒 Барахолка класса</h1>
  <span class="who">Вы: <b id="whoName"></b></span>
  <button class="btn secondary small" id="changeNameBtn">Сменить имя</button>
  <button class="btn" id="openFormBtn">+ Добавить</button>
</header>

<div class="container">
  <div class="form-box" id="formBox" style="display:none">
    <h2>Новый товар</h2>
    <div class="status" id="status"></div>
    <form id="form">
      <input type="text" id="title" placeholder="Название" required>
      <label>Цена (0 = даром)</label>
      <input type="number" id="price" placeholder="0" min="0" value="0">
      <textarea id="description" placeholder="Описание" rows="3"></textarea>
      <label>Фото</label>
      <input type="file" id="photo" accept="image/*" required>
      <div style="display:flex; gap:8px">
        <button type="submit" class="btn" id="submitBtn">Опубликовать</button>
        <button type="button" class="btn secondary" id="cancelFormBtn">Отмена</button>
      </div>
    </form>
  </div>

  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">Пока пусто. Нажмите «+ Добавить», чтобы выложить первый товар.</div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="top">
      <h2 id="mTitle">Товар</h2>
      <button class="close" id="closeModal">×</button>
    </div>
    <div class="content">
      <img class="big" id="mImg" alt="">
      <div class="price-big" id="mPrice"></div>
      <div class="desc" id="mDesc"></div>
      <div style="font-size:13px;color:#6b7280">Продавец: <b id="mSeller"></b></div>

      <div class="actions">
        <button class="btn danger" id="deleteBtn" style="display:none">Удалить товар</button>
      </div>

      <div class="chat">
        <h3>Чат по товару</h3>
        <div class="chat-list" id="chatList"></div>
        <div class="chat-form">
          <input type="text" id="chatInput" placeholder="Написать сообщение..." maxlength="500">
          <button class="btn" id="chatSend">Отправить</button>
        </div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

const SUPABASE_URL = 'https://cjoycyganukagvcfsimt.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WEWsxP_r4e9twQDk8vqhfw_L-pIV0cy';
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const gridEl = document.getElementById('grid');
const emptyEl = document.getElementById('empty');
const formBox = document.getElementById('formBox');
const form = document.getElementById('form');
const statusEl = document.getElementById('status');
const submitBtn = document.getElementById('submitBtn');
const modalBg = document.getElementById('modalBg');
const loginBg = document.getElementById('loginBg');
const whoName = document.getElementById('whoName');
const chatList = document.getElementById('chatList');
const chatInput = document.getElementById('chatInput');
let currentProduct = null;
let myName = '';

function getMyName() { return (localStorage.getItem('bara_name') || '').trim(); }
function setMyName(name) { localStorage.setItem('bara_name', name.trim()); myName = name.trim(); whoName.textContent = myName; }

function showLogin() {
  loginBg.classList.remove('hidden');
  document.getElementById('loginName').value = getMyName();
  document.getElementById('loginName').focus();
}
function hideLogin() { loginBg.classList.add('hidden'); }

document.getElementById('loginBtn').onclick = () => {
  const name = document.getElementById('loginName').value.trim();
  if (name.length < 2) { alert('Введите имя (минимум 2 символа)'); return; }
  setMyName(name);
  hideLogin();
  loadProducts();
};
document.getElementById('loginName').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('loginBtn').click();
});
document.getElementById('changeNameBtn').onclick = () => {
  if (!confirm('Сменить имя? Старые объявления и сообщения останутся привязаны к старому имени.')) return;
  showLogin();
};

function setStatus(msg, type = '') { statusEl.textContent = msg; statusEl.className = 'status ' + type; }

async function compressImage(file, maxSize = 1000, quality = 0.75) {
  const bitmap = await createImageBitmap(file);
  let { width, height } = bitmap;
  if (width > maxSize || height > maxSize) {
    if (width > height) { height = Math.round(height * maxSize / width); width = maxSize; }
    else { width = Math.round(width * maxSize / height); height = maxSize; }
  }
  const canvas = document.createElement('canvas');
  canvas.width = width; canvas.height = height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
  return new Promise(r => canvas.toBlob(r, 'image/jpeg', quality));
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function formatPrice(p) { return p > 0 ? p + ' ₽' : 'Даром'; }
function isMineName(name) { return myName && name && name.trim().toLowerCase() === myName.toLowerCase(); }
function isMine(p) { return isMineName(p.owner_name); }

async function loadProducts() {
  if (!myName) return;
  const { data, error } = await supabase.from('products').select('*').order('created_at', { ascending: false });
  if (error) { emptyEl.style.display = 'block'; emptyEl.textContent = 'Ошибка: ' + error.message; return; }
  gridEl.innerHTML = '';
  if (!data.length) { emptyEl.style.display = 'block'; return; }
  emptyEl.style.display = 'none';
  for (const p of data) {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      ${isMine(p) ? '<div class="mine">Моё</div>' : ''}
      <img src="${escapeHtml(p.image_url)}" alt="" loading="lazy">
      <div class="body">
        <div class="price">${formatPrice(p.price)}</div>
        <div class="title">${escapeHtml(p.title)}</div>
        <div class="seller">${escapeHtml(p.owner_name || p.seller_name || '')}</div>
      </div>`;
    card.addEventListener('click', () => openProduct(p));
    gridEl.appendChild(card);
  }
}

function openProduct(p) {
  currentProduct = p;
  document.getElementById('mTitle').textContent = p.title;
  document.getElementById('mImg').src = p.image_url || '';
  document.getElementById('mPrice').textContent = formatPrice(p.price);
  document.getElementById('mDesc').textContent = p.description || 'Без описания';
  document.getElementById('mSeller').textContent = p.owner_name || p.seller_name || 'Не указан';
  document.getElementById('deleteBtn').style.display = isMine(p) ? '' : 'none';
  chatInput.value = '';
  modalBg.classList.add('open');
  loadMessages(p.id);
}

function closeModal() { modalBg.classList.remove('open'); currentProduct = null; }
document.getElementById('closeModal').onclick = closeModal;
modalBg.addEventListener('click', e => { if (e.target === modalBg) closeModal(); });

async function loadMessages(productId) {
  chatList.innerHTML = '<div class="chat-empty">Загрузка...</div>';
  const { data, error } = await supabase
    .from('messages')
    .select('*')
    .eq('product_id', productId)
    .order('created_at', { ascending: true });
  if (error) { chatList.innerHTML = '<div class="chat-empty">Ошибка: ' + escapeHtml(error.message) + '</div>'; return; }
  if (!data.length) { chatList.innerHTML = '<div class="chat-empty">Пока нет сообщений. Напишите первым!</div>'; return; }
  chatList.innerHTML = '';
  for (const m of data) {
    const div = document.createElement('div');
    div.className = 'msg' + (isMineName(m.from_name) ? ' mine' : '');
    const canDel = isMineName(m.from_name);
    div.innerHTML = `
      <div class="meta">
        <b>${escapeHtml(m.from_name)}</b>
        <span>${new Date(m.created_at).toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' })}</span>
        ${canDel ? '<span class="del" data-id="' + m.id + '">удалить</span>' : ''}
      </div>
      <div>${escapeHtml(m.text)}</div>`;
    chatList.appendChild(div);
  }
  chatList.scrollTop = chatList.scrollHeight;
  chatList.querySelectorAll('.del').forEach(el => {
    el.onclick = async () => {
      if (!confirm('Удалить сообщение?')) return;
      const { error } = await supabase.from('messages').delete().eq('id', el.dataset.id);
      if (error) { alert('Ошибка: ' + error.message); return; }
      loadMessages(currentProduct.id);
    };
  });
}

async function sendMessage() {
  if (!currentProduct) return;
  const text = chatInput.value.trim();
  if (!text) return;
  if (!myName) { showLogin(); return; }
  const { error } = await supabase.from('messages').insert({
    product_id: currentProduct.id,
    from_name: myName,
    text
  });
  if (error) { alert('Ошибка отправки: ' + error.message); return; }
  chatInput.value = '';
  loadMessages(currentProduct.id);
}

document.getElementById('chatSend').onclick = sendMessage;
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

document.getElementById('deleteBtn').onclick = async () => {
  if (!currentProduct) return;
  if (!isMine(currentProduct)) { alert('Удалять можно только свои объявления'); return; }
  if (!confirm('Удалить этот товар вместе с чатом?')) return;
  const { error } = await supabase.from('products').delete().eq('id', currentProduct.id);
  if (error) { alert('Ошибка удаления: ' + error.message); return; }
  closeModal();
  loadProducts();
};

document.getElementById('openFormBtn').onclick = () => {
  formBox.style.display = 'block';
  formBox.scrollIntoView({ behavior: 'smooth' });
};
document.getElementById('cancelFormBtn').onclick = () => { formBox.style.display = 'none'; form.reset(); setStatus(''); };

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (!myName) { showLogin(); return; }
  submitBtn.disabled = true;
  try {
    const file = document.getElementById('photo').files[0];
    setStatus('Сжимаю фото...');
    const blob = await compressImage(file);
    const fileName = `${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
    setStatus('Загружаю фото...');
    const { error: upErr } = await supabase.storage.from('photos').upload(fileName, blob, { contentType: 'image/jpeg' });
    if (upErr) throw upErr;
    const { data: urlData } = supabase.storage.from('photos').getPublicUrl(fileName);
    setStatus('Публикую...');
    const { error: dbErr } = await supabase.from('products').insert({
      title: document.getElementById('title').value.trim(),
      price: parseInt(document.getElementById('price').value) || 0,
      description: document.getElementById('description').value.trim(),
      seller_name: myName,
      owner_name: myName,
      contact: null,
      image_url: urlData.publicUrl
    });
    if (dbErr) throw dbErr;
    form.reset();
    formBox.style.display = 'none';
    setStatus('');
    loadProducts();
  } catch (err) {
    setStatus('Ошибка: ' + err.message, 'error');
  } finally {
    submitBtn.disabled = false;
  }
});

myName = getMyName();
if (myName) { whoName.textContent = myName; hideLogin(); loadProducts(); }
else { showLogin(); }
</script>
</body>
</html>
